[env:stable]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

upload_speed = 460800
monitor_speed = 115200
upload_port = /dev/cu.usbserial-10
monitor_port = /dev/cu.usbserial-10
monitor_filters = 
    esp32_exception_decoder
    colorize

debug_tool = esp-builtin
debug_port = /dev/cu.usbmodemB8F862E295181
debug_speed = 12000

debug_init_cmds =
    target extended-remote $DEBUG_PORT
    set remote hardware-watchpoint-limit 2
    mon reset halt
    flushregs
    thb app_main
    c

debug_load_cmds = load
build_type = debug
debug_server = /Users/johanvanzijl/.platformio/packages/tool-openocd-esp32/bin/openocd
platform_packages =
  toolchain-xtensa-esp32s3@=8.4.0+2021r2-patch5
upload_flags = 
    --before=default_reset
    --after=hard_reset

; ============================================
; PSRAM configuratie (belangrijk!)
; ============================================
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi          ; <-- was: prsam_type (typo!)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.extra_flags = -DBOARD_HAS_PSRAM
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -ggdb3
    -Og
    -Iinclude
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    ; TFT_eSPI test nog op de IDF4-naam; zonder deze define komen alle sprites in interne RAM
    -D CONFIG_SPIRAM_SUPPORT=1
    ; -mfix-esp32-psram-cache-issue  ; <-- VERWIJDERD: alleen voor originele ESP32, NIET S3!
    ; -D CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096      ; <-- VERWIJDERD: werkt niet in Arduino core 3.x
    ; -D CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096     ; <-- VERWIJDERD: werkt niet in Arduino core 3.x
    ; -D CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=1         ; <-- VERWIJDERD: werkt niet in Arduino core 3.x
    -D AUDIOTASK_CORE=0
    -D USER_SETUP_LOADED
    -D ST7796_DRIVER
    -D USE_HSPI_PORT
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=8
    -D TFT_BL=18
    -D TOUCH_CS=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D LOAD_GFXFF
    -D SMOOTH_FONT
    -D SPI_FREQUENCY=27000000
    -D WM_DEBUG_LEVEL=3

lib_deps = 
    https://github.com/tzapu/WiFiManager.git
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson@^7.0.4
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.1.0
    bitbank2/PNGdec@^1.0.1
    bodmer/JPEGDecoder@^2.0.0
    makuna/RTC@^2.5.0
    xreef/PCF8575 library@^1.1.0
    https://github.com/sui77/rc-switch.git
    adafruit/Adafruit VEML7700 Library@^2.1.6
    adafruit/Adafruit NeoPixel@^1.10.6