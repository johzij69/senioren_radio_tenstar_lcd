# GEOPTIMALISEERDE HAPROXY CONFIG VOOR ESP32/IoT APPARATEN
# Deze configuratie minimaliseert geheugengebruik tijdens SSL handshake

frontend frontend-iot
    bind :444 ssl crt /etc/haproxy/ssl/ ssl-min-ver TLSv1.2 ssl-max-ver TLSv1.2 ciphers AES128-SHA:AES256-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK no-sslv3 no-tlsv10 no-tlsv11
    mode http

    # Alleen img.prio-ict.nl toestaan op deze poort
    acl is_img hdr(Host) -i img.prio-ict.nl
    acl is_img hdr(Host) -i img.prio-ict.nl:444

    # Blokkeer alle andere hosts
    http-request deny unless is_img

    # Gebruik dezelfde backend als de hoofd frontend
    use_backend backend_img if is_img

# EXTRA OPTIMALISATIES:
# 1. Gebruik een klein certificaat (max 2048-bit RSA, geen ECC)
# 2. Gebruik geen intermediate certificates als niet absoluut nodig
# 3. Overweeg een self-signed cert voor IoT (ESP32 valideert toch niet)

# CIPHER OPTIES (van minst naar meest geheugen):
# - AES128-SHA           (minimaal geheugen, CBC mode)
# - AES256-SHA           (iets meer geheugen, CBC mode)
# - AES128-SHA256        (TLS 1.2 met SHA256)
# - AES256-SHA256        (TLS 1.2 met SHA256)

# TESTEN:
# openssl s_client -connect img.prio-ict.nl:444 -tls1_2 -cipher AES128-SHA
